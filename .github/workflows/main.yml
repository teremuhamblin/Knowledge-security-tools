name: Build & Security Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & Validation Automatisée
    runs-on: ubuntu-latest

    steps:
      # 1. Date du jour
      - name: Set date
        id: date
        run: echo "today=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      # 2. Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Installation des dépendances
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git

      # 4. Analyse statique (exemple)
      - name: Static analysis
        run: echo "Static analysis OK"

      # 5. Tests unitaires (placeholder)
      - name: Run tests
        run: echo "Tests OK"

      # 6. Vérification sécurité (placeholder)
      - name: Security audit
        run: echo '{"security": "clean"}' > security-report.json

      # 7. Build (placeholder)
      - name: Build project
        run: |
          mkdir -p build-output
          echo "Build OK" > build-output/build.log

      # 8. Hash de vérification
      - name: Compute SHA256
        id: hash
        run: echo "sha256=$(sha256sum build-output/build.log | cut -d ' ' -f1)" >> $GITHUB_OUTPUT

      # 9. Génération de l’attestation Markdown
      - name: Generate build attestation
        run: |
          mkdir -p logs
          cat > build-attestation.md << 'EOF'
          
      # 10. Upload des artefacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build-output/
            logs/
            security-report.json
            build-attestation.md
